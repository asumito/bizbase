<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BizBase</title>
  
  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #1e1e1e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation Bar */
    .nav-bar {
      background: #151515;
      padding: 12px 30px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: #2d2d2d;
      color: #a5b4fc;
      border: 1px solid #444;
      padding: 8px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: #3a3a3a;
      transform: translateY(-1px);
    }
    .nav-btn.active {
      background: #a5b4fc;
      color: #1e1e1e;
      border-color: #a5b4fc;
    }

    .content {
      flex: 1;
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 30px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 2.8rem;
      color: #ffffff;
    }

    .quote {
      font-size: 1.6rem;
      color: #a5b4fc;
      font-style: italic;
      margin-bottom: 30px;
    }

    input[type="text"] {
      width: 100%;
      max-width: 600px;
      padding: 12px;
      font-size: 1.1rem;
      margin: 20px 0;
      border: 1px solid #444;
      background: #2d2d2d;
      color: #e0e0e0;
      border-radius: 8px;
    }

    .subject-group h3 {
      color: #a5b4fc;
      font-size: 1.5rem;
      margin: 30px 0 12px;
      border-bottom: 1px solid #444;
      padding-bottom: 8px;
    }

    ul { list-style: none; padding: 0; }
    li {
      margin: 10px 0;
      padding: 12px 16px;
      background: #252525;
      border-radius: 8px;
    }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Announcement now at bottom-left */
    .announcement-wrapper {
      margin-top: auto;           /* pushes to bottom */
      margin-bottom: 40px;
      text-align: left;
      max-width: 500px;
    }
    .announcement {
      background: #2d2d2d;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 20px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cdd6f4;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <!-- Navigation in the marked area -->
  <nav class="nav-bar">
    <a href="/" class="nav-btn active">Home</a>
    <a href="/about.html" class="nav-btn">About</a>
    <a href="/info.html" class="nav-btn">Info</a>
    <a href="https://google.com" class="nav-btn">Premium</a>

  </nav>

  <div class="content">
    <div>
      <h1>BizBase</h1>
      <div class="quote">"Education is the key to the future."</div>

      <input type="text" id="search" placeholder="Search PDFs..." autofocus />

      <ul id="pdf-list">
        <!-- Your PDF list will be injected here by script.js -->
      </ul>
    </div>

    <!-- Announcement moved to bottom-left -->
    <div class="announcement-wrapper">
      <div class="announcement" id="announcement">
        Loading announcement...
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Load announcement
    fetch('/announcement.txt')
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(text => {
        document.getElementById('announcement').textContent = text.trim() || 'No announcement at the moment.';
      })
      .catch(() => {
        document.getElementById('announcement').textContent = 'Failed to load announcement.';
      });
  </script>
</body>
</html>
